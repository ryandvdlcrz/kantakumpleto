<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | Folk Song Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><h1>Student performance</h1><div id="who"></div></header>
<main id="app"></main>
<script type="module">
import { auth, db, toEmail, msg } from "./firebase.js";
import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { doc, getDoc, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { SONGS } from "./songs.js";

const $ = s => document.querySelector(s), app = $("#app"), who = $("#who");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let rows = [];

function login() {
  app.innerHTML = `<section class="card auth"><h2>Admin log in</h2><form id="f"><label>Username or Email<input name="u" required autocomplete="username"></label>
  <label>Password<input name="p" type="password" required autocomplete="current-password"></label><p class="err" id="err" role="alert"></p><button class="btn">Log in</button></form></section>`;
  $("#f").onsubmit = async e => {
    e.preventDefault();
    const d = new FormData(e.target);
    const rawUser = String(d.get("u") ?? "").trim();
    const email = rawUser.includes("@") ? rawUser : toEmail(rawUser);
    try {
      await signInWithEmailAndPassword(auth, email, d.get("p"));
    } catch (x) {
      $("#err").textContent = msg(x);
    }
  };
}

onAuthStateChanged(auth, async u => {
  if (!u) { who.innerHTML = ""; return login(); }
  who.innerHTML = `<span>${esc(u.email.split("@")[0])}</span> <button class="link" id="lo">Log out</button>`;
  $("#lo").onclick = () => signOut(auth);
  let ok = false;
  try { ok = (await getDoc(doc(db, "admins", u.uid))).exists(); } catch { ok = false; }
  if (!ok) { app.innerHTML = `<section class="card auth"><h2>Admin only</h2><p>This account is not an admin. <a href="index.html">Go to the game</a>.</p></section>`; return; }
  load();
});

async function load() {
  app.innerHTML = "<p>Loading students...</p>";
  try {
    const myId = auth.currentUser?.uid;
    // The admin's own score document (if any) is left out so it does not count as a student.
    rows = (await getDocs(collection(db, "scores"))).docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(r => r.id !== myId);
  } catch (e) {
    app.innerHTML = `<section class="card"><p class="err">Could not load scores (${esc(e.code || e.message)}). Check your internet connection and the Firestore rules.</p><button class="btn" id="retry">Try again</button></section>`;
    $("#retry").onclick = load;
    return;
  }
  const secs = [...new Set(rows.map(r => r.section).filter(Boolean))].sort();
  app.innerHTML = `<div id="stats" class="total"></div>
  <div class="tools"><input id="q" placeholder="Search name or username" aria-label="Search"><select id="sec" aria-label="Section"><option value="">All sections</option>${secs.map(s => `<option>${esc(s)}</option>`).join("")}</select>
  <button class="btn" id="csv">Export CSV</button> <button class="link" id="rf">Refresh</button></div>
  <div class="table-wrap"><table><thead><tr><th>Name</th><th>Username</th><th>Section</th>${SONGS.map((s, i) => `<th title="${esc(s.title)}">S${i + 1}</th>`).join("")}<th>Total</th><th>Songs done</th><th>Last played</th><th>Action</th></tr></thead><tbody id="tb"></tbody></table></div>
  <p class="small">S1 to S${SONGS.length} are the best score (out of 3) per song. Hover a header to see the song title.</p>
  <p class="small">Delete removes the student's scores right away. Their login is removed the next time they try to sign in. To free the username immediately, also delete the user under Authentication in the Firebase console.</p>`;
  $("#q").oninput = draw; $("#sec").onchange = draw; $("#csv").onclick = exportCsv; $("#rf").onclick = load;
  $("#tb").onclick = async e => {
    const b = e.target.closest("button[data-id]");
    if (!b) return;
    const r = rows.find(x => x.id === b.dataset.id);
    if (!r) return;
    if (!confirm(`Delete ${r.name || r.username} (${r.username})?\n\nThis removes all their scores right away. Their login is removed the next time they try to sign in. This cannot be undone.`)) return;
    b.disabled = true;
    try { await deleteDoc(doc(db, "scores", r.id)); rows = rows.filter(x => x.id !== r.id); draw(); }
    catch (x) { b.disabled = false; alert("Could not delete: " + (x.code || x.message)); }
  };
  draw();
}

const lastAt = r => Math.max(0, ...Object.values(r.songs || {}).map(x => x.at || 0));
const fmt = t => t ? new Date(t).toLocaleString() : "";
function view() {
  const q = $("#q").value.toLowerCase(), sec = $("#sec").value;
  return rows.filter(r => (!sec || r.section === sec) && `${r.name} ${r.username}`.toLowerCase().includes(q)).sort((a, b) => (b.total || 0) - (a.total || 0));
}
function draw() {
  const l = view(), avg = l.length ? (l.reduce((a, r) => a + (r.total || 0), 0) / l.length).toFixed(1) : 0;
  $("#stats").textContent = `${l.length} students, average ${avg} of ${SONGS.length * 3} points`;
  $("#tb").innerHTML = l.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.username)}</td><td>${esc(r.section)}</td>${SONGS.map(s => `<td>${r.songs?.[s.id]?.best ?? "-"}</td>`).join("")}<td><b>${r.total || 0}</b></td><td>${Object.keys(r.songs || {}).length} of ${SONGS.length}</td><td>${esc(fmt(lastAt(r)))}</td><td><button class="link" data-id="${esc(r.id)}">Delete</button></td></tr>`).join("");
}

// Stops spreadsheet apps from running a cell as a formula when it starts with = + - @ or a control character.
const safe = v => {
  const s = String(v ?? "");
  return /^[=+\-@\t\r]/.test(s) ? "'" + s : s;
};
function exportCsv() {
  const head = ["Name", "Username", "Section", ...SONGS.map(s => s.title), "Total", "Last played"];
  const lines = [head, ...view().map(r => [r.name, r.username, r.section, ...SONGS.map(s => r.songs?.[s.id]?.best ?? ""), r.total || 0, fmt(lastAt(r))])]
    .map(row => row.map(v => `"${safe(v).replace(/"/g, '""')}"`).join(","));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv" }));
  a.download = "folk-song-scores.csv"; a.click();
}
</script>
</body>
</html>
