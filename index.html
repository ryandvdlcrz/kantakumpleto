<!doctype html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0E3B43">
<title>Folk Song Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* locked songs on the home screen */
  .song.locked{background:#dce8e3;border-style:dashed;box-shadow:none;cursor:not-allowed;opacity:.8}
  .song.locked:hover{transform:none}
  .song.locked .disc::before{filter:grayscale(1);opacity:.55;animation:none!important}
  .song.locked .disc em{background:#c4d6cf}
</style>
</head>
<body>
<div class="notes" id="notes" aria-hidden="true"></div>
<header class="top"><h1>Folk Song Adventure</h1><div id="who"></div></header>
<main id="app"></main>
<script type="module">
import { auth, db, toEmail, validUser, msg } from "./firebase.js";
import { createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, deleteUser, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { SONGS } from "./songs.js";

const $ = s => document.querySelector(s), app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let me = null, rec = null, isAdmin = false, regBusy = false, notice = "";
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

// floating music notes in the background
if (!calm) {
  $("#notes").innerHTML = Array.from({ length: 8 }, (_, k) =>
    `<span style="--l:${6 + k * 12}%;--s:${22 + (k % 3) * 10}px;--t:${14 + (k % 4) * 4}s;--d:${-k * 2.5}s">${"♪♫♬♩"[k % 4]}</span>`).join("");
}

// small confetti burst for a perfect score
function burst() {
  if (calm) return;
  for (let k = 0; k < 22; k++) {
    const e = document.createElement("span");
    e.className = "conf";
    e.textContent = "♪♫♬★"[k % 4];
    e.style.cssText = `--x:${Math.random() * 100 - 50}vw;--r:${Math.random() * 720 - 360}deg;--c:${["#F5B91E", "#E4572E", "#fff", "#6FD3B5"][k % 4]};animation-delay:${Math.random() * .3}s`;
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 2300);
  }
}

const level = p => p >= 1 ? "Kundiman Master" : p >= .75 ? "Bayan Star" : p >= .5 ? "Folk Singer" : p >= .25 ? "Rising Voice" : "New Singer";
const stars = n => [0, 1, 2].map(k => `<span class="${k < n ? "on" : ""}">★</span>`).join("");

// A song is perfect when its best score equals its number of questions.
const isPerfect = k => (rec?.songs?.[SONGS[k].id]?.best || 0) >= SONGS[k].q.length;
// The first song is always open. Every other song opens only after the one before it is perfect.
const isOpen = i => i === 0 || isPerfect(i - 1);

function topbar() {
  $("#who").innerHTML = me ? `<span>${esc(rec?.username || "")}</span> ${isAdmin ? '<a class="link" href="admin.html">Admin</a>' : ""} <button class="link" id="lo">Log out</button>` : "";
  if (me) $("#lo").onclick = () => signOut(auth);
}

function authView(reg = false) {
  app.innerHTML = `<section class="card auth"><div class="bigdisc" aria-hidden="true"></div><h2>${reg ? "Create your account" : "Log in"}</h2>
  <p class="small">Sing along, answer the quiz and collect stars!</p>
  <form id="f">${reg ? `<label>Full name<input name="name" required maxlength="60"></label><label>Section<input name="section" required maxlength="30"></label>` : ""}
  <label>Username<input name="u" required maxlength="20" autocomplete="username" autocapitalize="off" placeholder="letters, numbers, _"></label>
  <label>Password<input name="p" type="password" required minlength="6" autocomplete="${reg ? "new" : "current"}-password"></label>
  <p class="err" id="err" role="alert">${esc(notice)}</p><button class="btn">${reg ? "Create account" : "Log in"}</button></form>
  <button class="link" id="sw">${reg ? "I already have an account" : "Create an account"}</button></section>`;
  $("#sw").onclick = () => authView(!reg);
  $("#f").onsubmit = async e => {
    e.preventDefault();
    const d = new FormData(e.target), u = d.get("u"), p = d.get("p"), err = $("#err");
    err.textContent = ""; notice = "";
    if (!validUser(u)) { err.textContent = "Username: 3 to 20 letters, numbers or _ only."; return; }
    const name = reg ? String(d.get("name") || "").trim() : "";
    const section = reg ? String(d.get("section") || "").trim() : "";
    if (reg && (!name || !section)) { err.textContent = "Please fill in your full name and section."; return; }
    try {
      if (reg) {
        regBusy = true;
        const c = await createUserWithEmailAndPassword(auth, toEmail(u), p);
        try {
          await setDoc(doc(db, "scores", c.user.uid), { username: u.trim().toLowerCase(), name, section: section.toUpperCase(), songs: {}, total: 0, createdAt: serverTimestamp() });
        } catch (e2) {
          // Do not leave a login without a score record, or the username stays taken.
          await deleteUser(c.user).catch(() => signOut(auth));
          throw e2;
        }
        regBusy = false;
        enter(c.user);
      } else await signInWithEmailAndPassword(auth, toEmail(u), p);
    } catch (x) { regBusy = false; err.textContent = msg(x); }
  };
}

async function enter(u) {
  me = u;
  let s;
  try { s = await getDoc(doc(db, "scores", u.uid)); }
  catch {
    app.innerHTML = `<section class="card auth"><h2>Could not load your account</h2><p class="small">Check your internet connection and try again.</p>
    <button class="btn" id="rt">Try again</button> <button class="link" id="lo2">Log out</button></section>`;
    $("#rt").onclick = () => enter(u);
    $("#lo2").onclick = () => signOut(auth);
    return;
  }
  let adminKnown = false;
  try { isAdmin = (await getDoc(doc(db, "admins", u.uid))).exists(); adminKnown = true; } catch { isAdmin = false; }
  if (!s.exists() && adminKnown && !isAdmin) {
    // The teacher deleted this student's record, so finish the job and remove the login too.
    notice = "This account no longer exists. Please create a new account or ask your teacher.";
    try { await deleteUser(u); } catch { await signOut(auth); }
    return;
  }
  rec = s.exists() ? s.data() : { username: u.email.split("@")[0], songs: {}, total: 0 };
  topbar();
  home();
}

function home() {
  const best = id => rec.songs?.[id]?.best, max = SONGS.length * 3, tot = rec.total || 0;
  const played = SONGS.filter(s => best(s.id) != null).length;
  app.innerHTML = `<section class="card hero"><div><p class="badge">♫ ${level(tot / max)}</p><h2>Kumusta, ${esc(rec.name || rec.username)}!</h2></div>
  <div><div class="meter-top"><span>${tot} of ${max} points</span><span>${played} of ${SONGS.length} songs played</span></div>
  <div class="track" role="progressbar" aria-label="Points" aria-valuemin="0" aria-valuemax="${max}" aria-valuenow="${tot}"><i style="width:${Math.round(tot / max * 100)}%"></i></div></div></section>
  <h3 class="sec">Pick a song to play</h3>
  <div class="grid">${SONGS.map((s, i) => {
    const b = best(s.id);
    if (!isOpen(i)) {
      return `<button class="song locked" disabled style="--d:${i * 40}ms"><span class="disc" aria-hidden="true"><em>🔒</em></span>
      <span class="meta"><b>${esc(s.title)}</b><small>Locked. Get a perfect score on “${esc(SONGS[i - 1].title)}” to unlock.</small></span></button>`;
    }
    return `<button class="song${b >= s.q.length ? " gold" : ""}" data-i="${i}" style="--d:${i * 40}ms"><span class="disc" aria-hidden="true"><em>${i + 1}</em></span>
    <span class="meta"><b>${esc(s.title)}</b><span class="stars" role="img" aria-label="Best score ${b || 0} of 3">${stars(b || 0)}</span><small>${b == null ? "Not played yet" : `Best score: ${b} of 3`}</small></span></button>`;
  }).join("")}</div>`;
  app.querySelectorAll(".song[data-i]").forEach(b => b.onclick = () => watch(+b.dataset.i));
}

function watch(i) {
  if (!isOpen(i)) { home(); return; }
  const s = SONGS[i];
  app.innerHTML = `<button class="link" id="bk">Back to songs</button><section class="card"><p class="badge"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Now playing</p><h2>${esc(s.title)}</h2>
  <p>Watch the video, sing along and remember the lyrics. Then answer ${s.q.length} questions. You need a perfect score to unlock the next song.</p>
  <div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${s.yt}?rel=0" title="${esc(s.title)}" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
  <p class="small">Video not showing? <a href="https://www.youtube.com/watch?v=${s.yt}" target="_blank" rel="noopener">Open it on YouTube</a>.</p>
  <button class="btn" id="go">I’m ready for the questions</button></section>`;
  $("#bk").onclick = home;
  $("#go").onclick = () => quiz(i, 0, 0);
  scrollTo(0, 0);
}

// Returns the numbers 0 to n-1 in random order (Fisher-Yates), used to shuffle answer choices.
const shuffled = n => {
  const a = Array.from({ length: n }, (_, k) => k);
  for (let k = n - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; }
  return a;
};

const scramble = w => { let r; do { r = [...w].sort(() => Math.random() - .5); } while (r.join("") === w && w.length > 1); return r; };

function quiz(i, n, score) {
  const s = SONGS[i], q = s.q[n], last = n + 1 >= s.q.length;
  app.innerHTML = `<div class="bar"><span>${esc(s.title)}</span><span>Question ${n + 1} of ${s.q.length}</span></div>
  <div class="dots" aria-hidden="true">${s.q.map((_, k) => `<i class="${k < n ? "on" : k === n ? "cur" : ""}"></i>`).join("")}</div>
  <section class="card" id="qc"><p class="qt">${esc(q.t)}</p><div id="ans"></div><p id="fb" class="fb" role="status"></p>
  <button class="btn" id="nx" hidden>${last ? "See my score" : "Next question"}</button></section>`;
  let sc = score;
  // The correct answer is never shown after a wrong try. The student only learns right or wrong.
  const done = ok => {
    if (ok) sc++;
    $("#fb").textContent = ok ? "Correct! Tama! 🎉" : "Not quite.";
    $("#fb").className = "fb " + (ok ? "ok" : "bad");
    $("#qc").classList.add(ok ? "pop" : "shake");
    $("#nx").hidden = false; $("#nx").focus();
    $("#nx").onclick = () => last ? finish(i, sc) : quiz(i, n + 1, sc);
  };
  if (q.o) {
    // The choices are shuffled every time the question is shown. data-k keeps the ORIGINAL index,
    // so q.a still points to the right answer; only the position and the A/B/C letter change.
    $("#ans").innerHTML = shuffled(q.o.length).map((k, pos) => `<button class="opt" data-k="${k}"><i>${"ABCDEFGHIJ"[pos]}</i>${esc(q.o[k])}</button>`).join("");
    const btns = [...app.querySelectorAll(".opt")];
    const byK = k => btns.find(x => +x.dataset.k === k);
    if (Array.isArray(q.a)) {
      // several correct answers: the student ticks all of them, then presses Check
      const pick = new Set();
      $("#ans").insertAdjacentHTML("beforebegin", `<p class="small">Choose all the correct answers, then press Check.</p>`);
      $("#ans").insertAdjacentHTML("afterend", `<button class="btn" id="ck">Check</button>`);
      btns.forEach(b => {
        b.setAttribute("aria-pressed", "false");
        b.onclick = () => {
          const k = +b.dataset.k, on = !pick.has(k);
          on ? pick.add(k) : pick.delete(k);
          b.setAttribute("aria-pressed", String(on));
          b.style.background = on ? "#FFF1C2" : "";
          b.style.outline = on ? "3px solid #F5B91E" : "";
        };
      });
      $("#ck").onclick = () => {
        if (!pick.size) return;
        btns.forEach(x => { x.disabled = true; x.style.background = ""; x.style.outline = ""; });
        $("#ck").hidden = true;
        const ok = pick.size === q.a.length && q.a.every(k => pick.has(k));
        if (ok) pick.forEach(k => byK(k).classList.add("ok"));
        done(ok);
      };
    } else btns.forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = k === q.a;
      btns.forEach(x => { x.disabled = true; });
      b.classList.add(ok ? "ok" : "bad");
      done(ok);
    });
  } else {
    $("#ans").insertAdjacentHTML("beforebegin", `<p class="small">Tap the letters in the right order to spell the word.</p>`);
    $("#ans").innerHTML = `<div class="tiles" id="slots" aria-label="Your answer"></div><div class="tiles" id="pool" aria-label="Jumbled letters"></div>
    <p><button class="btn" type="button" id="clr">Clear</button> <button class="btn" type="button" id="ck" disabled>Check</button></p>`;
    const letters = scramble(q.j), picked = [];
    const act = (el, f) => { el.onclick = f; el.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); f(); } }; };
    const pool = letters.map((c, k) => { const el = document.createElement("span"); el.textContent = c; el.setAttribute("role", "button"); el.tabIndex = 0; el.style.cssText = `--i:${k};cursor:pointer`; return el; });
    const slots = letters.map(() => document.createElement("span"));
    $("#pool").append(...pool); $("#slots").append(...slots);
    const refresh = () => {
      pool.forEach((el, k) => { el.style.visibility = picked.includes(k) ? "hidden" : "visible"; });
      slots.forEach((el, n) => {
        const k = picked[n];
        el.textContent = k == null ? "\u00a0" : letters[k];
        el.style.cssText = k == null ? "background:transparent;border-style:dashed;opacity:.55" : "cursor:pointer";
        if (k == null) { el.removeAttribute("role"); el.removeAttribute("tabindex"); } else { el.setAttribute("role", "button"); el.tabIndex = 0; }
      });
      $("#ck").disabled = picked.length !== letters.length;
    };
    pool.forEach((el, k) => act(el, () => { if (!picked.includes(k)) { picked.push(k); refresh(); } }));
    slots.forEach((el, n) => act(el, () => { if (n < picked.length) { picked.splice(n, 1); refresh(); } }));
    $("#clr").onclick = () => { picked.length = 0; refresh(); };
    $("#ck").onclick = () => {
      if (picked.length !== letters.length) return;
      const ok = picked.map(k => letters[k]).join("") === q.j;
      $("#ans").style.pointerEvents = "none";
      $("#clr").disabled = true; $("#ck").disabled = true;
      slots.forEach(el => { el.style.background = ok ? "#d9f2e3" : "#fbdcdc"; el.style.opacity = "1"; });
      done(ok);
    };
    refresh();
  }
}

async function save(i) {
  const s = SONGS[i], st = $("#sv");
  if (!st) return;
  st.textContent = "Saving your score...";
  try {
    await setDoc(doc(db, "scores", me.uid), { songs: { [s.id]: rec.songs[s.id] }, total: rec.total, updatedAt: serverTimestamp() }, { merge: true });
    st.textContent = "Score saved.";
  } catch { st.innerHTML = `Could not save. <button class="link" id="rt">Try again</button>`; $("#rt").onclick = () => save(i); }
}

function finish(i, sc) {
  const s = SONGS[i], total = s.q.length, prev = rec.songs?.[s.id] || {}, perfect = sc === total;
  rec.songs = { ...rec.songs, [s.id]: { best: Math.max(prev.best || 0, sc), last: sc, attempts: (prev.attempts || 0) + 1, at: Date.now() } };
  rec.total = Object.values(rec.songs).reduce((a, x) => a + x.best, 0);
  const hasNext = i + 1 < SONGS.length;
  const note = perfect
    ? (hasNext ? "Perfect! Ang galing! The next song is unlocked." : "Perfect! Ang galing! You finished every song!")
    : `You got ${sc} of ${total}. You need ${total} of ${total} to unlock the next song. Watch the video again and give it another try!`;
  app.innerHTML = `<section class="card"><h2>${esc(s.title)}</h2>
  <div class="bigstars" role="img" aria-label="${sc} of ${total} stars">${[0, 1, 2].map(k => `<span class="${k < sc ? "on" : ""}" style="--i:${k}">★</span>`).join("")}</div>
  <p class="qt">${esc(note)}</p>
  <p id="sv" class="small" role="status"></p>
  ${perfect
    ? `${hasNext ? '<button class="btn" id="nextsong">Play the next song</button> ' : ""}<button class="link" id="bk">Back to songs</button> <button class="link" id="again">Watch this song again</button>`
    : `<button class="btn" id="retry">Try the questions again</button> <button class="link" id="again">Watch the video again</button> <button class="link" id="bk">Back to songs</button>`}
  </section>`;
  if ($("#nextsong")) $("#nextsong").onclick = () => watch(i + 1);
  if ($("#retry")) $("#retry").onclick = () => quiz(i, 0, 0);
  $("#again").onclick = () => watch(i);
  $("#bk").onclick = home;
  if (perfect) burst();
  save(i);
}

onAuthStateChanged(auth, u => {
  if (regBusy) return;
  if (u) enter(u); else { me = null; rec = null; isAdmin = false; topbar(); authView(); }
});
</script>
</body>
</html>
